<text x="30" y="772" font-size="17" fill="#000000">One instruction per clock edge. The core has 2,288 NAND gates and 152 flip-flops.</text>
<text x="30" y="796" font-size="17" fill="#000000">Longest path: 99 NAND levels, from the opcode through the ALU carry chain to a register.</text>
